# orca.yaml — hooks for Orca worktrees.
# Setup runs after each new worktree is created.
#
# Env inyectado por Orca:
#   $ORCA_ROOT_PATH     — checkout principal (fuente de archivos locales)
#   $ORCA_WORKTREE_PATH — worktree recién creado

scripts:
  setup: |
    set -euo pipefail
    bash "$ORCA_WORKTREE_PATH/scripts/worktree-setup.sh"
